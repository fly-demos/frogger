name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  push-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frogger:${{ steps.meta.outputs.tag }}

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TAG: ${{ steps.meta.outputs.tag }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping Render trigger."
            exit 0
          fi
          IMGURL_PART=$(python3 -c "import os, urllib.parse; u=os.environ['DH_USER']; t=os.environ['TAG']; print(urllib.parse.quote(f'docker.io/{u}/frogger:{t}', safe=''))")
          if [[ "$HOOK" != *\?* ]]; then SEP='?'; else SEP='&'; fi
          curl -fsS -X POST "${HOOK}${SEP}imgURL=${IMGURL_PART}"
