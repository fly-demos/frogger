name: Deploy to Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - name: Set image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push to GHCR + Fly
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/frogger:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/frogger:latest
            ${{ env.FLY_REGISTRY_SUBDOMAIN }}/docker/frogger:${{ steps.meta.outputs.tag }}
            ${{ env.FLY_REGISTRY_SUBDOMAIN }}/docker/frogger:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_REF=ghcr.io/${{ github.repository_owner }}/frogger:${{ steps.meta.outputs.tag }}
            FLY_REGISTRY=${{ env.FLY_REGISTRY_SUBDOMAIN }}

      - name: Deploy to Northflank staging
        env:
          NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NF_TEAM: ${{ vars.NORTHFLANK_TEAM_ID }}
          NF_PROJECT: ${{ vars.NORTHFLANK_PROJECT_ID }}
          NF_SERVICE: ${{ vars.NORTHFLANK_STAGING_SERVICE_ID }}
          NF_CRED: ${{ vars.NORTHFLANK_REGISTRY_CREDENTIAL_ID }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/frogger:${{ steps.meta.outputs.tag }}
        run: |
          curl -fsS -X PATCH \
            "https://api.northflank.com/v1/teams/${NF_TEAM}/projects/${NF_PROJECT}/services/deployment/${NF_SERVICE}" \
            -H "Authorization: Bearer ${NF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"deployment\":{\"external\":{\"imagePath\":\"${IMAGE}\",\"credentials\":\"${NF_CRED}\"}}}"
