name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  push-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - name: Set image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.FLY_REGISTRY_SUBDOMAIN }}/docker/frogger:${{ steps.meta.outputs.tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_REF=${{ env.FLY_REGISTRY_SUBDOMAIN }}/docker/frogger:${{ steps.meta.outputs.tag }}
            FLY_REGISTRY=${{ env.FLY_REGISTRY_SUBDOMAIN }}

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -e
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping Render trigger."
            exit 0
          fi
          IMGURL_PART=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(f\"{os.environ['FLY_REGISTRY_SUBDOMAIN']}/docker/frogger:{os.environ['TAG']}\", safe=''))")
          if [[ "$HOOK" != *\?* ]]; then SEP='?'; else SEP='&'; fi
          curl -fsS -X POST "${HOOK}${SEP}imgURL=${IMGURL_PART}"
